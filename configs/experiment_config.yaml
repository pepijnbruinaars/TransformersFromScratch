experiment_name: "default_encoder_decoder_translation"

model:
  architecture: "encoder_decoder"
  n_blocks: 6
  d_model: 512
  n_heads: 8
  d_ff: 2048
  dropout_rate: 0.1
  use_flash_attention: true

training:
  n_epochs: 20
  scheduler:
    type: "cosine"
    learning_rate: 5e-4
    warmup_ratio: 0.05
    min_lr_ratio: 0.1
  optimizer:
    name: "adam"
    weight_decay: 1e-5
    betas: [0.9, 0.999]
    epsilon: 1e-8
  validate_every_n_steps: 1000

data:
  batch_size: 8
  tokenizer_path: "models/tokenizers/europarl_tokenizer.json"
  vocab_size: 30000  # BPE vocabulary size

checkpoint:
  save_dir: "checkpoints/"
  save_frequency: 600  # Seconds between time-based checkpoints

