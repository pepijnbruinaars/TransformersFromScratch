[pytest]
# Pytest configuration for Transformers from Scratch

# Minimum version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add src directory to Python path
pythonpath = .

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers for organizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests combining multiple components
    slow: Tests that take significant time to run
    config: Tests related to configuration system
    loader: Tests related to config loading functionality
